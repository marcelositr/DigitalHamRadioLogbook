name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Rust and Linux dependencies
        uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: ci-quality

      - name: Check repository whitespace
        run: git diff --check HEAD^ --

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  tests:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Rust and Linux dependencies
        uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: ci-tests

      - name: Run all active tests
        run: cargo test --locked

      - name: Build application
        run: cargo build --locked

  packaging:
    name: Linux packaging smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: sh -n packaging/linux/*.sh

      - name: Run packaging smoke test
        run: packaging/linux/smoke-test.sh
