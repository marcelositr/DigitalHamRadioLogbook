name: README screenshot

on:
  push:
    branches: [feat/v0.11-ui-product-refactor]
    paths:
      - .github/workflows/readme-screenshot.yml

permissions:
  contents: read

jobs:
  screenshot:
    name: Capture demo logbook
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Rust and Linux dependencies
        uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: readme-screenshot

      - name: Install screenshot tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xdotool imagemagick sqlite3

      - name: Build application
        run: cargo build --locked

      - name: Create isolated demo database
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/dhrl-home"
          export XDG_DATA_HOME="$RUNNER_TEMP/dhrl-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/dhrl-config"
          mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"

          Xvfb :99 -screen 0 1200x800x24 >/tmp/dhrl-xvfb.log 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          export SLINT_BACKEND=winit-software
          sleep 1
          timeout 4s ./target/debug/digital-ham-radio-logbook >/tmp/dhrl-init.log 2>&1 || true
          kill "$xvfb_pid" 2>/dev/null || true

          db="$XDG_DATA_HOME/digital-ham-log/logbook.sqlite3"
          test -f "$db"
          now=$(date +%s)
          sqlite3 "$db" <<SQL
          PRAGMA foreign_keys=ON;
          INSERT INTO qsos(callsign, datetime_start_utc, frequency_hz, band, mode, rst_sent, rst_received, grid_locator, name, qth, notes, created_at_utc, updated_at_utc)
          VALUES
            ('PY2OMT', $((now-600)), 438450000, '70cm', 'DMR', '59', '59', 'GG58', 'Marcelo', 'Ituverava, SP', 'BrandMeister regional contact', $now, $now),
            ('PP2XYZ', $((now-1320)), 14074000, '20m', 'FT8', '-08', '-12', 'GH64', 'Paulo', 'Brasilia, DF', 'FT8 evening opening', $now, $now),
            ('CT1ABC', $((now-2400)), 145675000, '2m', 'DSTAR', '59', '57', 'IM58', 'Joao', 'Lisboa, PT', 'D-STAR reflector contact', $now, $now),
            ('PY5HAM', $((now-3900)), 439500000, '70cm', 'C4FM', '59', '59', 'GG54', 'Rafael', 'Curitiba, PR', 'System Fusion room contact', $now, $now),
            ('LU8DIG', $((now-5400)), 7074000, '40m', 'FT8', '-05', '-09', 'GF05', 'Carlos', 'Buenos Aires, AR', 'South America FT8', $now, $now),
            ('PY3RAD', $((now-7200)), 145550000, '2m', 'FM', '59', '59', 'GF49', 'Andre', 'Porto Alegre, RS', 'Direct digital-radio field test', $now, $now);

          INSERT INTO digital_routes(qso_id, access_type, network, repeater_callsign, hotspot)
          VALUES (1, 'repeater', 'BrandMeister', 'PY2KAA', NULL);
          INSERT INTO dmr_metadata(qso_id, remote_dmr_id, local_dmr_id, talkgroup, timeslot, color_code, call_type, notes)
          VALUES (1, 7241234, 7240000, 724, 1, 1, 'group', 'TG 724');

          INSERT INTO ft8_metadata(qso_id, snr_sent_db, snr_received_db, power_watts, audio_frequency_hz, source_software, protocol, final_message)
          VALUES
            (2, -8, -12, 30, 1350, 'WSJT-X', 'FT8', 'RR73'),
            (5, -5, -9, 40, 1120, 'WSJT-X', 'FT8', '73');

          INSERT INTO dstar_metadata(qso_id, reflector, module, mycall, urcall, rpt1, rpt2, notes)
          VALUES (3, 'REF001', 'C', 'PY2OMT', 'CQCQCQ', 'CT1ABC B', 'CT1ABC G', 'REF001C');

          INSERT INTO ysf_metadata(qso_id, room, wires_x_node, repeater, network, access_type, tx_dg_id, rx_dg_id, notes)
          VALUES (4, 'Brazil', 'PY5HAM-ND', 'PY5RPT', 'WIRES-X', 'repeater', 0, 0, 'Brazil room');
          SQL

          sqlite3 "$db" 'PRAGMA quick_check; SELECT COUNT(*) FROM qsos;'

      - name: Capture real application window
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/dhrl-home"
          export XDG_DATA_HOME="$RUNNER_TEMP/dhrl-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/dhrl-config"
          export DISPLAY=:99
          export SLINT_BACKEND=winit-software

          mkdir -p readme-artifact
          Xvfb :99 -screen 0 1200x800x24 >/tmp/dhrl-xvfb.log 2>&1 &
          xvfb_pid=$!
          sleep 1
          ./target/debug/digital-ham-radio-logbook >/tmp/dhrl-app.log 2>&1 &
          app_pid=$!

          window=''
          for _ in $(seq 1 30); do
            window=$(xdotool search --onlyvisible --name 'Digital Ham Radio Logbook' 2>/dev/null | head -n1 || true)
            [ -n "$window" ] && break
            sleep 1
          done
          if [ -z "$window" ]; then
            cat /tmp/dhrl-app.log >&2 || true
            xwininfo -root -tree >&2 || true
            exit 1
          fi

          sleep 2
          import -window "$window" readme-artifact/logbook-demo.png
          identify readme-artifact/logbook-demo.png

          kill "$app_pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-logbook-screenshot
          path: readme-artifact/logbook-demo.png
          if-no-files-found: error
          retention-days: 1
