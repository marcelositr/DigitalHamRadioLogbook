name: Setup Rust Linux
description: Install the pinned Rust toolchain, Linux GUI dependencies, and Cargo cache.

inputs:
  cache-key:
    description: Cache key namespace for this job.
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          libfontconfig1-dev \
          libwayland-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev

    - name: Install Rust 1.98.0
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, pinned 2026-08-29
      with:
        toolchain: 1.98.0
        components: clippy, rustfmt

    - name: Cache Cargo artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}

    - name: Report toolchain
      shell: bash
      run: |
        set -euo pipefail
        rustc --version --verbose
        cargo --version --verbose
