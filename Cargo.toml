[package]
name = "digital-ham-radio-logbook"
version = "0.3.0"
edition = "2021"
description = "Local and offline desktop logbook for digital amateur radio contacts"
license = "MIT"
repository = "https://github.com/marcelositr/DigitalHamRadioLogbook"
keywords = ["amateur-radio", "logbook", "dmr", "ft8", "adif"]
categories = ["gui", "database"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
slint = "1.9"
toml = "0.8"
urlencoding = "2.1"
webbrowser = "1.0"

[build-dependencies]
slint-build = "1.9"
